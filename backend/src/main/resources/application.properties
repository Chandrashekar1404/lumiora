spring.application.name=lumiora-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/lumiora
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.open-in-view=false


# Lumiora Bootstrap Admin
lumiora.bootstrap.admin.email=admin@lumiora.com
lumiora.bootstrap.admin.password=${LUMIORA_BOOTSTRAP_ADMIN_PASSWORD}
lumiora.bootstrap.admin.first-name=Super
lumiora.bootstrap.admin.last-name=Admin
lumiora.bootstrap.admin.phone=9999999999


# JWT Configuration
lumiora.jwt.secret=lumiora-development-secret-key-change-before-production-2026
lumiora.jwt.expiration=86400000


# Development Student Bootstrap
lumiora.bootstrap.student.email=student@lumiora.com
lumiora.bootstrap.student.password=Student@123
lumiora.bootstrap.student.first-name=Test
lumiora.bootstrap.student.last-name=Student
lumiora.bootstrap.student.phone=8888888888
